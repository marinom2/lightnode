name: CI

on:
  # Gate the things that ship: pushes to main (what Vercel deploys and what the
  # published packages are cut from) and every PR into main. Feature-branch
  # commits do not trigger a run, so the old "CI failed on every commit" email
  # spam stays gone while merges and release-bearing changes are always checked.
  # Still runnable on demand from the Actions tab or `gh workflow run ci.yml`.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Lint · Typecheck · Unit · Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Build the local file:./sdk package BEFORE lint/typecheck. The app imports
      # `lightnode-sdk`, whose types live in sdk/dist (gitignored, so absent on a
      # clean checkout). `prebuild` builds it for `npm run build`, but typecheck
      # runs earlier and would otherwise fail with "Cannot find module
      # 'lightnode-sdk'" plus cascading implicit-any errors. Vercel never hit this
      # because it only runs the build step.
      - name: Build local SDK
        run: npm --prefix sdk install --no-audit --no-fund && npm --prefix sdk run build
      - run: npm run lint
      - run: npm run typecheck
      # Runs the unit suite AND enforces the coverage floors in vitest.config.ts.
      - run: npm run test:coverage
      - run: npm run build
      # Keep the standalone SDK compiling (it's excluded from the app tsconfig).
      - run: npx tsc --noEmit -p sdk/tsconfig.json

  desktop:
    name: Desktop (cargo check)
    runs-on: ubuntu-latest
    # The Tauri backend is the one part of this repo that nothing compiles until
    # a release is cut: release.yml builds it, but only on a `v*` tag. So a Rust
    # change can sit on main for weeks and first break at the moment you try to
    # ship installers. `cargo check` is the cheap half of that build - it type-
    # checks and borrow-checks without linking or bundling - so it catches the
    # error where it is still a one-line fix.
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      # tauri's build script links against the system webview; without these the
      # crate fails to configure and the check never reaches our code.
      - name: System deps for the webview
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
            libjavascriptcoregtk-4.1-dev build-essential pkg-config
      - name: cargo check
        working-directory: desktop/src-tauri
        run: cargo check --locked --all-targets

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Advisory, NOT a gate. The Playwright smoke run drives the live app, which
    # depends on external services (Reown config, the public subgraph) that 403 /
    # rate-limit in CI, so it flakes for reasons unrelated to the change. Keep it
    # running for signal + the uploaded report, but never fail the workflow on it
    # (that was emailing on every push). The `verify` job is the real gate.
    continue-on-error: true
    env:
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
