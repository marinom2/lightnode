name: CI

on:
  # Gate the things that ship: pushes to main (what Vercel deploys and what the
  # published packages are cut from) and every PR into main. Feature-branch
  # commits do not trigger a run, so the old "CI failed on every commit" email
  # spam stays gone while merges and release-bearing changes are always checked.
  # Still runnable on demand from the Actions tab or `gh workflow run ci.yml`.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Lint · Typecheck · Unit · Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Build the local file:./sdk package BEFORE lint/typecheck. The app imports
      # `lightnode-sdk`, whose types live in sdk/dist (gitignored, so absent on a
      # clean checkout). `prebuild` builds it for `npm run build`, but typecheck
      # runs earlier and would otherwise fail with "Cannot find module
      # 'lightnode-sdk'" plus cascading implicit-any errors. Vercel never hit this
      # because it only runs the build step.
      - name: Build local SDK
        run: npm --prefix sdk install --no-audit --no-fund && npm --prefix sdk run build
      - run: npm run lint
      - run: npm run typecheck
      # Runs the unit suite AND enforces the coverage floors in vitest.config.ts.
      - run: npm run test:coverage
      - run: npm run build
      # Keep the standalone SDK compiling (it's excluded from the app tsconfig).
      - run: npx tsc --noEmit -p sdk/tsconfig.json

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Advisory, NOT a gate. The Playwright smoke run drives the live app, which
    # depends on external services (Reown config, the public subgraph) that 403 /
    # rate-limit in CI, so it flakes for reasons unrelated to the change. Keep it
    # running for signal + the uploaded report, but never fail the workflow on it
    # (that was emailing on every push). The `verify` job is the real gate.
    continue-on-error: true
    env:
      NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_WALLETCONNECT_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
